<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Ankur Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="dashboard-header">
    <h2>📚 Ankur Academy - Admin</h2>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="videos.html">Videos</a>
        <a href="notes.html">Notes</a>
        <a href="index.html">Logout</a>
    </nav>
</header>

<section class="welcome">
    <h1>Admin Dashboard</h1>
    <p>Manage your courses, videos and notes.</p>
</section>

<section class="subjects">

    <div class="card">
        <h2>📹 Add Video</h2>

        <input type="text" placeholder="Video Title"><br><br>

        <input type="text" placeholder="YouTube Video Link"><br><br>

        <button class="btn">Add Video</button>
    </div>

    <div class="card">
        <h2>📄 Add Notes</h2>

        <input type="text" placeholder="Notes Title"><br><br>

        <input type="file"><br><br>

        <button class="btn">Upload PDF</button>
    </div>

    <div class="card">
        <h2>📊 Website Stats</h2>

        <p>Students : 0</p>
        <p>Videos : 0</p>
        <p>Notes : 0</p>
        <p>Courses : 4</p>
    </div>

</section>

<footer>
    <p>© 2026 Ankur Academy | All Rights Reserved</p>
</footer>

<script src="script.js"></script>

</body>
</html>
